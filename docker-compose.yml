services:
  db:
    image: postgres:16-alpine
    container_name: homologador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homologador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homologador123}
      POSTGRES_DB: ${POSTGRES_DB:-homologador}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-homologador} -d $${POSTGRES_DB:-homologador}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homologador-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homologador}:${POSTGRES_PASSWORD:-homologador123}@db:5432/${POSTGRES_DB:-homologador}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-chave-jwt-ambiente-container-homologador-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-homologador@sistema.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Homologador@123}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
